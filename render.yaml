# Despliegue en Render (Blueprint). Cada push a main reconstruye la imagen del Dockerfile.
services:
  - type: web
    name: wdsd-sgw-dashboard        # nombre del servicio en Render
    runtime: docker                 # construye con el Dockerfile del repositorio
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8050"
      - key: WDSD_INFERENCIA_VIVO   # 0 = la predicción en vivo corre en el navegador (en el servidor pica ~0,9 GB; el plan da 512 MB)
        value: "0"
