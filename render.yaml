# Despliegue en Render (Blueprint). Cada push a main reconstruye la imagen del Dockerfile.
services:
  - type: web
    name: wdsd-sgw-dashboard        # nombre del servicio en Render
    runtime: docker                 # construye con el Dockerfile del repositorio
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8050"
      - key: WDSD_INFERENCIA_VIVO   # 0 en el plan gratuito: la inferencia usa ~660 MB y el plan tiene 512 MB
        value: "0"
