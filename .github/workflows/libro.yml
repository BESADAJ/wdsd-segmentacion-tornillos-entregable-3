name: Construir y publicar el libro

on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/libro.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libro
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Jupyter Book
        run: python -m pip install "jupyter-book==1.0.4.post1"

      - name: Construir el libro
        run: jupyter-book build book/ --warningiserror

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: book/_build/html
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
