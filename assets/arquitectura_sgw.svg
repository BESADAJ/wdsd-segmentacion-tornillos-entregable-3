<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 1420 740" font-family="Lato, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="titulo desc"><title id="titulo">Arquitectura de Mask R-CNN y dónde interviene SGW</title><desc id="desc">Arriba, la red de Mask R-CNN: imagen, backbone ResNet-50, FPN, RPN, RoIAlign, cabezas de caja y de máscara y salida. Abajo, el aporte de SGW durante el entrenamiento: en el RPN y en las cabezas decide qué anclas y propuestas son positivas con la similitud s de Wasserstein normalizada por el tamaño del tornillo, con los umbrales de Mask R-CNN. Ejemplo: una caja de 10 px desplazada 4 px tiene IoU 0,43 y s 0,53; una de 100 px, IoU 0,92 y s 0,92.</desc><defs><marker id="ft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2C3E50"/></marker><marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E67E22"/></marker></defs><rect x="-10" y="0" width="100%" height="100%" fill="#FFFFFF"/><text x="0" y="30" font-size="14" fill="#5D6D7E" font-weight="700" text-anchor="start">ARQUITECTURA DE MASK R-CNN, QUE SGW CONSERVA (CONFIGURACIÓN DEL REPOSITORIO)</text><rect x="0" y="70" width="170" height="130" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="85" y="100" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">Imagen</text><text x="85" y="123" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">RGB 1280×720</text><text x="85" y="146" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">(lado corto 720)</text><rect x="205" y="70" width="170" height="130" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="290" y="100" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">Backbone</text><text x="290" y="123" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">ResNet-50</text><text x="290" y="146" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">preentrenado</text><text x="290" y="169" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">en COCO</text><rect x="410" y="70" width="170" height="130" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="495" y="100" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">FPN</text><text x="495" y="123" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">mapas P2 a P6</text><text x="495" y="146" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">256 canales</text><rect x="615" y="70" width="170" height="130" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="700" y="100" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">RPN</text><text x="700" y="123" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">anclas 8 a 128 px</text><text x="700" y="146" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">aspectos 0,5 / 1 / 2</text><text x="700" y="169" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">→ propuestas</text><rect x="820" y="70" width="170" height="130" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="905" y="100" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">RoIAlign</text><text x="905" y="123" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">recorta cada</text><text x="905" y="146" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">propuesta en</text><text x="905" y="169" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">P2 a P5</text><rect x="1025" y="50" width="170" height="78" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="1110" y="80" font-size="16" fill="#2C3E50" font-weight="700" text-anchor="middle">Cabeza de caja</text><text x="1110" y="103" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">clase + ajuste</text><rect x="1025" y="142" width="170" height="78" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="1110" y="172" font-size="16" fill="#2C3E50" font-weight="700" text-anchor="middle">Cabeza de máscara</text><text x="1110" y="195" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">28×28 por objeto</text><rect x="1230" y="70" width="170" height="130" rx="8" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="1315" y="100" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">Salida</text><text x="1315" y="123" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">cajas, scores</text><text x="1315" y="146" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">y máscaras</text><text x="1315" y="169" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="middle">(score ≥ umbral)</text><line x1="172" y1="135" x2="201" y2="135" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><line x1="377" y1="135" x2="406" y2="135" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><line x1="582" y1="135" x2="611" y2="135" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><line x1="787" y1="135" x2="816" y2="135" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><line x1="992" y1="129" x2="1021" y2="89" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><line x1="992" y1="141" x2="1021" y2="181" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><line x1="1197" y1="89" x2="1226" y2="129" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><line x1="1197" y1="181" x2="1226" y2="141" stroke="#2C3E50" stroke-width="2" marker-end="url(#ft)"/><text x="0" y="268" font-size="14" fill="#B5560B" font-weight="700" text-anchor="start">APORTE DE SGW, EN EL ENTRENAMIENTO</text><rect x="550" y="300" width="300" height="150" rx="8" fill="#FDF3EA" stroke="#E67E22" stroke-width="2.5"/><text x="700" y="330" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">Asignación en el RPN</text><text x="568" y="366" font-size="15" fill="#5D6D7E" font-weight="700" text-anchor="start">Mask R-CNN (base):</text><text x="568" y="388" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">IoU ≥ 0,7 positiva · &lt; 0,3 negativa</text><text x="568" y="416" font-size="15" fill="#B5560B" font-weight="700" text-anchor="start">SGW (original):</text><text x="568" y="438" font-size="15" fill="#2C3E50" font-weight="400" text-anchor="start">s ≥ 0,7 positiva · &lt; 0,3 negativa</text><rect x="960" y="300" width="300" height="150" rx="8" fill="#FDF3EA" stroke="#E67E22" stroke-width="2.5"/><text x="1110" y="330" font-size="18" fill="#2C3E50" font-weight="700" text-anchor="middle">Asignación en las cabezas</text><text x="978" y="366" font-size="15" fill="#5D6D7E" font-weight="700" text-anchor="start">Mask R-CNN (base):</text><text x="978" y="388" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">IoU ≥ 0,5 positiva (caja y máscara)</text><text x="978" y="416" font-size="15" fill="#B5560B" font-weight="700" text-anchor="start">SGW (original):</text><text x="978" y="438" font-size="15" fill="#2C3E50" font-weight="400" text-anchor="start">s ≥ 0,5 positiva (caja y máscara)</text><line x1="700" y1="298" x2="700" y2="206" stroke="#E67E22" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fn)"/><line x1="1110" y1="298" x2="1110" y2="226" stroke="#E67E22" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fn)"/><rect x="1030" y="17" width="22" height="16" rx="3" fill="#F6F8FA" stroke="#C9D1D9" stroke-width="1.5"/><text x="1060" y="30" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">red de Mask R-CNN</text><rect x="1220" y="17" width="22" height="16" rx="3" fill="#FDF3EA" stroke="#E67E22" stroke-width="2.5"/><text x="1250" y="30" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">aporte de SGW</text><text x="0" y="324" font-size="15" fill="#2C3E50" font-weight="700" text-anchor="start">Decide qué anclas y propuestas</text><text x="0" y="346" font-size="15" fill="#2C3E50" font-weight="700" text-anchor="start">cuentan como positivas.</text><text x="0" y="380" font-size="15" fill="#B5560B" font-weight="700" text-anchor="start">s(g, b): similitud de Wasserstein</text><text x="0" y="402" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">normalizada por el tamaño del tornillo.</text><text x="0" y="424" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">Reemplaza al IoU (fórmula debajo).</text><text x="0" y="458" font-size="15" fill="#2C3E50" font-weight="700" text-anchor="start">Sin costo extra al predecir: no añade</text><text x="0" y="480" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">capas ni parámetros (43,9 M en los dos).</text><text x="0" y="520" font-size="14" fill="#B5560B" font-weight="700" text-anchor="start">POR QUÉ: LA MISMA CAJA DESPLAZADA 4 PX (DIBUJADAS AL MISMO TAMAÑO)</text><rect x="0" y="538" width="670" height="172" rx="8" fill="#FFFFFF" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="30" y="590" width="96" height="96" rx="2" fill="none" stroke="#2C3E50" stroke-width="2.5"/><rect x="68.4" y="590" width="96" height="96" rx="2" fill="none" stroke="#E67E22" stroke-width="2.5" stroke-dasharray="5 4"/><text x="78" y="578" font-size="14" fill="#5D6D7E" font-weight="400" text-anchor="middle">10×10 px</text><text x="200" y="572" font-size="17" fill="#2C3E50" font-weight="700" text-anchor="start">Tornillo típico de WDSD (≈ 10 px)</text><text x="200" y="604" font-size="17" fill="#2980B9" font-weight="700" text-anchor="start">IoU = 0,43</text><text x="350" y="604" font-size="17" fill="#B5560B" font-weight="700" text-anchor="start">s = 0,53</text><text x="200" y="636" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">El desplazamiento es el 40 % del lado. En las cabezas</text><text x="200" y="660" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">(umbral 0,5) el IoU la descarta y SGW la toma como</text><text x="200" y="684" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">positiva: más propuestas positivas por tornillo.</text><rect x="730" y="538" width="670" height="172" rx="8" fill="#FFFFFF" stroke="#E67E22" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="760" y="590" width="96" height="96" rx="2" fill="none" stroke="#2C3E50" stroke-width="2.5"/><rect x="763.84" y="590" width="96" height="96" rx="2" fill="none" stroke="#E67E22" stroke-width="2.5" stroke-dasharray="5 4"/><text x="808" y="578" font-size="14" fill="#5D6D7E" font-weight="400" text-anchor="middle">100×100 px</text><text x="930" y="572" font-size="17" fill="#2C3E50" font-weight="700" text-anchor="start">Objeto grande (100 px)</text><text x="930" y="604" font-size="17" fill="#2980B9" font-weight="700" text-anchor="start">IoU = 0,92</text><text x="1080" y="604" font-size="17" fill="#B5560B" font-weight="700" text-anchor="start">s = 0,92</text><text x="930" y="636" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">El desplazamiento es el 4 % del lado: los dos criterios</text><text x="930" y="660" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">casi coinciden. κ = 0,45 se calibró para eso, así los</text><text x="930" y="684" font-size="15" fill="#5D6D7E" font-weight="400" text-anchor="start">umbrales de Mask R-CNN se conservan.</text><rect x="0" y="720" width="22" height="14" rx="2" fill="none" stroke="#2C3E50" stroke-width="2.5"/><text x="30" y="732" font-size="14" fill="#5D6D7E" font-weight="400" text-anchor="start">caja real g</text><rect x="140" y="720" width="22" height="14" rx="2" fill="none" stroke="#E67E22" stroke-width="2.5" stroke-dasharray="5 4"/><text x="170" y="732" font-size="14" fill="#5D6D7E" font-weight="400" text-anchor="start">ancla o propuesta b</text></svg>
